<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
    <!-- 1. Inherit Fedora's system fonts & aliases (required for ReaImGui's sans-serif) -->
    <include ignore_missing="yes">/etc/fonts/fonts.conf</include>

    <!-- 2. Load your portable REAPER/fonts folder (relative to this fonts.conf file) -->
    <dir prefix="relative">fonts</dir>

    <!-- 3. Enforce crisp rendering (since HOME=$FAKE_HOME hides KDE's ~/.config/fontconfig) -->
    <match target="font">
        <edit name="antialias" mode="assign"><bool>true</bool></edit>
        <edit name="hinting" mode="assign"><bool>true</bool></edit>
        <edit name="hintstyle" mode="assign"><const>hintslight</const></edit>
        <edit name="autohint" mode="assign"><bool>false</bool></edit>
        <edit name="rgba" mode="assign"><const>rgb</const></edit>
        <edit name="lcdfilter" mode="assign"><const>lcddefault</const></edit>
    </match>

    <!-- 4. Store cache inside Fake Home -->
    <cachedir>~/.cache/fontconfig</cachedir>
</fontconfig>
